<main 
class="relative w-full min-h-screen flex flex-col"
[ngClass]="isDark ? 'bg-[var(--dark-navy-950)]' : 'bg-[var(--light-gray-300)]' "
>

    @if (isDark == false) {
        <img src="./images/bg-desktop-light.jpg" alt="banner">
    } @else {
        <img src="./images/bg-desktop-dark.jpg" alt="banner">
    }

    <div class="absolute w-[40%] h-auto flex flex-col justify-between items-center top-6 left-1/2 -translate-x-1/2">

        <div class="w-full h-20 flex flex-row justify-between items-center mb-4">
            <p class="text-[40px] uppercase font-semibold tracking-[1rem] text-[var(--light-gray-300)]">todo</p>
            <button 
            class="w-[30px] h-[30px] cursor-pointer"
            (click)="switchMode()"
            >
                @if (isDark == false) {
                    <img src="./images/icon-moon.svg" alt="icon">
                } @else {
                    <img src="./images/icon-sun.svg" alt="icon">
                }
            </button>
        </div>

        <div class="w-full h-20">
            <input 
            type="text" 
            placeholder="Create a new todo" 
            class="w-full focus:outline-none rounded cursor-pointer px-8 py-4 mb-4"
            #input (keydown.enter)="addTodo(input.value); input.value = '' "
            [ngClass]="isDark ? 'bg-[var(--dark-navy-900)] text-[var(--dark-purple-300)]' : 'bg-[var(--light-gray-300)] text-[var(--light-navy-850)]' "
            >
        </div>

        <ul 
        class="w-full h-auto flex flex-col justify-around rounded px-4 py-4"
        [ngClass]="isDark ? 'bg-[var(--dark-navy-900)] text-[var(--dark-purple-300)]' : 'bg-[var(--light-gray-300)] text-[var(--light-navy-850)]' "
        >
            <li class="w-full">
                <div class="flex justify-center items-center w-[26px] h-[26px] rounded-full cursor-pointer" style="background: var(--bg-color);">
                    <img src="./images/icon-check.svg" alt="check icon" class="w-[14px] h-[14px]">
                </div>
            </li>
            
            @for (item of filteredTodo; track $index) {
                <div 
                class="flex items-center py-4"
                (click)="toggleCheck($index)"
                (mouseenter)="HoverIndex = $index"
                (mouseleave)="HoverIndex = null"
                >
                    <div
                    class="flex justify-center items-center w-[26px] h-[26px] rounded-full cursor-pointer hover:border-1" 
                    [ngClass]="[
                        item.checked ?  'check-bg' : '', 
                        isDark ? 'bg-[var(--dark-navy-900)]' : 'bg-[var(--light-purple-500)]' ]"
                    >
                        <img src="./images/icon-check.svg" alt="check icon" class="w-[14px] h-[14px]">
                    </div>
                    <li 
                    class="text-base ps-8"
                    [ngClass]="isDark ? 'text-[var(--dark-purple-300)]' : 'text-[var(--light-navy-850)]' "
                    >
                        {{ item.text }}
                    </li>
                    @if (HoverIndex === $index) {
                        <div 
                        class="flex justify-center items-center w-[26px] h-[26px] cursor-pointer ms-auto"
                        (click)="deleteTodo(item)"
                        >
                            <img src="./images/icon-cross.svg" alt="delete">
                        </div>
                    }
                </div>

            } 
            @if (todoList.length > 0) {
                <div class="flex items-center justify-between pe-4 py-4">
                    
                    <p class="text-sm text-[var(--light-gray-600)]">
                        {{ filteredTodo.length }} items left
                    </p>
    
                    <div class="w-50 flex justify-between">
                        <button 
                        class="text-base text-[var(--light-gray-600)] hover:text-[var(--light-navy-850)] cursor-pointer"
                        (click)="setFilter('all')"
                        >
                            All
                        </button>
                        <button 
                        class="text-base text-[var(--light-gray-600)] hover:text-[var(--light-navy-850)] cursor-pointer"
                        (click)="setFilter('active')"
                        >
                            Active
                        </button>
                        <button 
                        class="text-base text-[var(--light-gray-600)] hover:text-[var(--light-navy-850)] cursor-pointer"
                        (click)="setFilter('completed')"
                        >
                            Completed
                        </button>
                    </div>
    
                    <button 
                    class="text-sm text-[var(--light-gray-600)]
                    hover:text-[var(--light-navy-850)] cursor-pointer"
                    >
                        Clear Completed
                    </button>
    
                </div>
            }
        </ul>
    </div>

</main>
